name: Parser golden tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golden:
    # runner 镜像钉住 24.04：ubuntu-latest 将在 2026-10-19~11-19 迁移到 Ubuntu 26.04。
    # 理由与 daily.yml 同一段注释；将来升级改版本号并手动验证。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install deps
        run: |
          pip install -r scraper/requirements.txt
          pip install -r requirements.txt
      # 密封化回归（HTML/VLM 响应均已固化为 tests/fixtures/，离线可跑；失败即红）
      - name: Run golden-case regression tests
        run: python tests/test_parser_golden.py
      # 一致性守卫：server.py 下发路径与切片生成路径必须逐条一致
      - name: Run frontend-consistency guard tests
        run: python tests/test_frontend_consistency.py
      # 以下三项 2026-09-10 纳入：此前被 .gitignore 挡在 CI 之外（当时误判为「CI 未调用」），
      # 覆盖时间解析 / 幻觉守卫 / 数据质量——恰是规则解析改动最密集、却无回归护栏的三块。
      # 均纯离线、秒级完成，不引入网络与密钥依赖。
      - name: Run timeparse tests
        run: python tests/test_timeparse.py
      - name: Run hallucination-guard tests
        run: python tests/test_hallucination_guard.py
      - name: Run data-quality tests
        run: python tests/test_data_quality.py
      # 以下五项 2026-09-26 纳入：多场拆分候选9/10/11与质量闸门（2026-09-25/26 两次
      # 解析器大改的行为锁定）、模型A融合、引证裁决、简介括号、地点前缀——此前均不在
      # 任何 workflow 中，解析器再改动时 CI 全绿也可能已回归。均纯离线、秒级完成。
      - name: Run multi-session split tests
        run: python tests/test_multi_session_split.py
      - name: Run hybrid tests
        run: python tests/test_hybrid.py
      - name: Run cited-judge tests
        run: python tests/test_cited_judge.py
      - name: Run bio-bracket tests
        run: python tests/test_bio_bracket.py
      - name: Run bio-stop-words tests
        run: python tests/test_bio_stop_words.py
      - name: Run location-prefix tests
        run: python tests/test_location_prefix.py
      - name: Run frontend schema guard tests
        run: python tests/test_frontend_schema.py
      # 2026-09-29 纳入：全字段行为快照（渐进重构第 2 步）。
      # golden 是抽查（每页仅 4~6 项断言），location/lectureStart/abstract 等 20+ 字段
      # 全未锁定；本套件按记录全字段比对基线 parser_snapshot.json，锁「纯规则基线」
      # （模块内强制关 LLM A/B，与 CI 无密钥环境一致），使拆 _parse_detail_impl
      # 期间任何字段的意外变化都立即变红。基线含已知缺陷，由 KnownDefectTest
      # 的 xfail 台账背书——重构中禁止用 --bless 抹平意外失败。
      # 纯离线、约 15 秒。
      - name: Run parser behavior snapshot tests
        run: python tests/test_parser_snapshot.py
      - name: Run stage function variable leak check
        run: python tests/test_stage_var_leak.py
      # 2026-09-30 纳入：前端分片组装冒烟。前端已按职责拆成 8 个文件，靠 defer 顺序
      # 与全局词法环境共享常量；任一分片漏挂、顺序错、常量改名都会在浏览器里直接白屏，
      # 而 Python 侧测试全绿也看不出来。用 node 的 vm 按序执行全部分片做集成校验，
      # 秒级完成、无需浏览器与网络。
      - name: Run frontend bundle smoke test
        run: node tests/js/app_bundle_smoke.js
      # 2026-09-30 纳入：长文本（简介/摘要）加载流程。bio+abstract 占数据 68%，已从主分片
      # 剥离到 16 个 detail 桶，「何时拉、搜索要不要等、缺桶怎么办」全靠前端状态机自洽；
      # 这些分支在浏览器里只有弱网 / 清缓存后才显现，CI 里无从观察。用真实分片 + fetch 桩
      # 覆盖全部分支，纯 node、无浏览器无网络，秒级完成。
      - name: Run long-text loading flow test
        run: node tests/js/app_longtext_flow.js
      # 2026-09-30 纳入：折叠类名一致性。卡片简介/摘要的折叠行数由模板的 line-clamp-N 类控制，
      # 而 _measureClamp 靠硬编码类名列表判断元素是否处于折叠态、再决定「展开」按钮是否显示。
      # 两者不同步的症状是「文本被截断却没有展开按钮」——用户看不到全文，且**无任何报错**（静默失效），
      # 快照/golden 锁的是解析器、也抓不到。这里静态比对两处类名集合，秒级完成。
      - name: Run clamp class consistency test
        run: node tests/js/app_clamp_consistency.js
      # 2026-09-30 纳入：顶部总数滚动动画。动画时长由「距上次 bump 的间隔 + 本次增量」自适应
      # （原为固定 500ms，与 4 路并发下 1.8~18s 的乱序到达不匹配 → 数字「平滑上滚→长时静止→
      # 猛跳一段」）。这段状态机依赖 requestAnimationFrame 时序与 performance.now()，
      # 浏览器里只能靠肉眼判断、CI 无从观察；这里用 node vm + 可控时钟逐帧仿真三种到达时序，
      # 锁住「逐帧单调不减」「终值收敛到真实总数」「不许退回固定时长」三条不变量。
      - name: Run header count animation test
        run: node tests/js/app_count_animation.js
      # 2026-09-30 纳入 3 套此前**未被任何 workflow 引用**的测试（CI 审计发现）。
      # 三者都覆盖「静默漏抓/静默重复抓取」这条最贵的失败模式，恰恰是规则改动最密集处：
      #   test_ledger     —— 被拒 URL 台账（gy/zhx/ibrr 等源曾单轮白抓 586 页、净新增 0）
      #   test_listdate   —— 列表页条目日期过滤的水位口径（哲社曾落后 4876 天）
      #   test_admin_notice_ad3 —— 事务性通知负向规则（负例挡错、正例须放行）
      # 均纯离线、秒级完成。
      - name: Run rejected-URL ledger tests
        run: python tests/test_ledger.py
      - name: Run listdate cutoff tests
        run: python tests/test_listdate.py
      - name: Run admin notice AD3 tests
        run: python tests/test_admin_notice_ad3.py
      # 2026-09-30 引入 server.py 的**首个**测试集（此前零覆盖）。锁两个真实缺陷：
      #   B4 sources.yaml 写接口丢 19 行人工注释（PyYAML dump 不保注释）
      #   B3 非 dict JSON body 使调用方 AttributeError 崩线程
      # 全部用例在 tempfile 里读写sources 副本，零网络、绝不触碰真实文件。
      - name: Run server tests
        run: python tests/test_server.py
      # 2026-09-30 引入：列表页取回失败必须进 failed_sources（B8）。
      # 此前 fetch 返回 None → collect_links([]) → 循环不进 → return None（=成功）
      # → 水位照常推进 → 该时段讲座永久漏抓且无任何痕迹。
      # 本套件同时锁死三态分层：只「取不回」判失败，「取回但0 条」不判
      # （否则栏目改版会永久冻结全局水位闸门）。
      - name: Run list-page failure accounting tests
        run: python tests/test_list_page_failure.py
      # 2026-10-10 引入：数据对账门禁。此前护栏只有固定常数 `< 3000` 的塌方兜底，
      # 只能拦「数量级塌方」：某学院官网改版导致该源数据被清空、总数只掉 5%
      # 时全部门禁照常放行，静默丢数无人知晓。本套件锁住按源对账（增量下每个
      # college 只增不减，任何源归零/缩水 >30% 即报警）与总量对账两道新防线，
      # 并验证它们对真实主库不误报。
      - name: Run data reconciliation gate tests
        run: python tests/test_data_reconciliation.py
      # 2026-10-10 引入：全库 --full 的按源保护。此前只有 --source 模式有
      # 「产出 0 条 /缩水 >50% → 保留旧数据」，--full 从空 dict 重建却是零保护，
      # 源站改版会把该学院全部历史静默抹除且水位照常推进（实测经管学院 837 条
      # 可被清成 0 而总数仍 >3000）。
      - name: Run full-shrink protection tests
        run: python tests/test_full_shrink_protection.py
      # 2026-10-10 引入：新源强制全量 + 失效源告警。加了新信息源（或老源换
      # 改版后的新地址）时，水位线 / 被拒台账 / PAGESTOP 三道闸门会把「库中
      # 没有的历史讲座」全部挡掉——源加进去了但一条也补不回来，且全程无告警。
      - name: Run new-source full-scan tests
        run: python tests/test_new_source_full_scan.py
      # 2026-09-30 引入：env 开关真值判定单一事实源。此前全仓 4 处开关各写一套
      # 关闭值集合，同一串 'no'/'False' 在不同开关上效果相反——用户写「想关掉」
      # 却把功能留着，且这类失效是静默的（日志正常、数据正常，只是行为反了）。
      # 本套件既锁值语义矩阵，也锁「4 处调用点判定必须一致」+「不得回退到内联集合」。
      - name: Run env flag semantics tests
        run: python tests/test_env_flags.py
      # 2026-09-30 引入：讲者归一（B6）三方口径一致性。此前落库判重
      # （scraper._normalize_speaker）与前端归一键（speaker_keys）是两套实现：
      # 前者剥英文头衔、后者不剥；前者职称表未按长度降序（'张三副教授'→'张三副'，
      # 库内已污染 2 条）且缺 7 项职称。同一人在两侧算出不同键 → 跨源合并静默失效。
      # 本套件同时锁「不得误剥真实人名」——'Jean-Claude Dreher' 被剥成 'eher'
      # 比不剥更坏（会凭空造出错误的合并目标）。
      - name: Run speaker normalization tests
        run: python tests/test_speaker_normalize.py
      # 2026-09-30 引入：讲者姓名尾部的**行政职务**残片（讲者归一第三处缺口）。
      # 落库「刘维泉副」+ 单位「总裁(杭州乒乓智能技术有限公司」（括号不闭合），
      # 根因是解析器职称表只含学术职称、不含职务，而姓名按 4→2 字截取后
      # 「刘维泉副总裁」只剩职务首字，锚 $ 的整体成词正则匹配不到。
      # 本套件用**源页正文原文**做 fixture（手写合成样本会因标签全半角不同而走
      # 不同分支，把真实缺陷掩盖掉），并锁死一条反向约束：职务词绝不能进
      # _TITLE_ALT_FULL——那张表作用于单位串，会把「中国心理学会副理事长，浙江大学…」
      # 截断成「中国心理学会」。
      - name: Run speaker duty-suffix tests
        run: python tests/test_speaker_duty_suffix.py

      # 讲者姓名切点（2026-10-01）：姓名原先按字数贪心截取，不认职称边界，
      # 会把职称首字吞进姓名。本套件锁「按职称词起始位置切」的正例，
      # 并锁两条反向约束——真人名（周博/胡理/王硕…）不得被误切、
      # 单位里的职称不得被当切点。
      - name: Run speaker name cut-point tests
        run: python tests/test_speaker_title_cut.py

      # 姓名+机构粘连（2026-10-14）：N1a 的 O3a「两侧>=2字保留词块空格」
      # 是死代码（正则只捕获单字、判据 len(left)>=2 恒假），CJK 间空格
      # 实际被全删 → 讲者提取的空格优先路径（parsers.py 4780-4802，为
      # bug 4267 设计）从未激活，「姓名 单位」被迫走 4→2 字降序 + 词表
      # 守卫兜底，词表覆盖不全即双错（郭庆华中/中师范大学实测，源页
      # physics 12852 原文「报告专家：郭庆 华中师范大学」有空格）。
      # 本套件锁三层：①N1a 词块空格的保留/删除行为（主判据，单字侧删除
      # 语义与旧实现逐字节一致）②无空格粘连下守卫归还末字（破坏验证用
      # 无空格输入——带空格输入在 N1a 修复后恒绿，压不到守卫）③末字
      # 巧合反例不得回退（秦晓华/华南师范大学等 8 例，2 字残名全部过
      # _looks_like_real_name，纯规则原理上无法区分粘连与巧合）。
      - name: Run speaker-affiliation glue guard tests
        run: python tests/test_speaker_aff_glue_20261014.py

      # 英文主讲人姓名形态（2026-10-06，maths8855 回归）：源页
      # 「报告人: Quoc-Hung NGUYEN 副研究员」抓回后 speaker 为空——姓名校验的
      # 分隔符集不认连字符、英文姓名切分正则不认连字符段与全大写姓（NGUYEN），
      # 职称 lookahead 也没有「副研究员」，三处同时挡死；LLM 提的名字又被
      # 溯源闸门拒掉（llmRejected: speaker），于是落库为空。
      # 本门锁：连字符+全大写姓可通过、职位词仍被拦、正文/标题两种入参都能取名、
      # 同构页面端到端 speaker 正确，且断言在**纯规则**下成立（不依赖 LLM 密钥）。
      - name: Run latin speaker name tests
        run: python tests/test_speaker_latin_name.py

      # 语料门禁（2026-10-07 拆闸配套）：生产库全部非空 speaker 反钉人名词表。
      # 词表历史上四轮人肉补漏（每次都是线上丢名字→事后补表），本门把「存量数据
      # 必须能过当前词表」固化为阻断——收紧词表若误杀库内真名，合并前即红。
      - name: Run speaker corpus gate
        run: python tests/test_speaker_corpus_gate.py

      # 拒而未填报警（2026-10-07 拆闸配套）：锁定 8855 事故签名（llmRejected 含
      # speaker 且 speaker 最终为空）。此前被拒的值与理由双双丢失、只能用户肉眼
      # 发现；配合 llmRejectReason 留证，同类事故当天红灯并附原值。speaker 硬拦，
      # affiliation/bio/abstract 的拒且空属正确拒绝，仅打印观测。
      - name: Run gate reject evidence alarm
        run: python tests/test_gate_reject_evidence.py

      # sourceCount / sources 记账一致性（2026-10-08）。四类缺陷都只表现为
      # 「统计数字不对」，无任何报错：C 类 MS5 单场回退漏清 sourceCount（活 bug，
      # 已修 parsers）、D 类合并去重用 college 当键致少算（活 bug，已修 scraper）、
      # A 类脚本写死 0、B 类历史遗留。本套件含两条实库红线：单场页不得带
      # splitMode 残留、多场组整组 sc 不得为 0——它们是 C 类缺陷最易察觉的信号。
      - name: Run sourceCount consistency guards
        run: python tests/test_source_count_consistency.py

      # 标题日期前缀剥离回归（2026-10-07，psy283）：日期区间「7月2日-7月4日」
      # 只被剥掉首段，残留「-7月4日…」再被导航噪声剥离的「去前导孤立数字」
      # 误吃，标题剩「月4日…」。修复为整段区间剥离。
      - name: Run title date prefix clean tests
        run: python tests/test_title_clean.py

      # 2026-10-02 引入：核心模块**可编译性**门禁。
      # 起因是一次批量编辑把 `_stats_dirty = {...}` 误写成 `def _stats_dirty = {...}`，
      # server.py 直接 SyntaxError 而无人察觉——CI 从不 import 它（公网部署用不到，
      # 它只在本地起服务时才被执行），既有用例也抓不到「语法层面」的坏文件。
      # py_compile 是纯语法分析（不导入、不执行、不落 __pycache__），零成本零副作用。
      - name: Run module compile gate
        run: python tests/test_module_compile.py

      # 防漂移元测试（2026-10-14 P2-5）：锁「deploy 的 GATE_TESTS ⊇ 本文件引用、
      # 无游离测试、deploy needs:gate 在位、cron 时刻三处同步」。此前它只在 deploy
      # gate 侧跑，PR 路径不跑——只改本文件忘同步 GATE_TESTS 时 PR 全绿、合并后才拦，
      # 反馈晚一个环节，正是元测试要防的模式（两侧必须同步，见该套件 docstring）。
      - name: Run CI gate coverage meta tests
        run: python tests/test_ci_gate_coverage.py

      # 分层验证映射完整性（2026-10-18 甲方案）：scripts/select_tests.py 的
      # 文件→测试映射表防腐化。背景：门禁涨到 677 pytest + 21 node 后，每次
      # 改动跑全套 + 纯净检出复跑达 5-6 分钟，瓶颈是「每次都全量」而非测试
      # 数量。分层后改动中只跑相关组（实测 13s），推送前才跑全套。本门锁
      # 四类红线：新增测试/源码忘了归组即红、未知文件升级 ALL 安全默认、
      # FULL_ONLY 元测试不被子集组漏跑、典型改动分组结果正确。
      - name: Run layered test-mapping integrity tests
        run: python tests/test_layer_mapping.py

      # 云端计数（Supabase）迁移 SQL 结构守卫（2026-10-17 深夜漏洞复盘）：
      # anon key 公开是设计定位，闸门全在 DB 侧——上线当晚实测 increment_like/
      # want 缺 least 上钳，灌 p_delta=99999 可刷爆计数。本套件锁「三函数两路径
      # 双钳 + check 上限 + RLS 只读授权 + 入库 SQL 与生成器逐字一致」。
      - name: Run Supabase migration SQL structure guards
        run: python tests/test_supabase_migration.py

      # 云端计数前端层单测（2026-10-17）：vm 沙箱复现 app.cloud.js 的七类场景
      # （无配置禁用 / 批量读解析 / 权威值 / 401 软失败 / 请求形态 / 配置缓存）。
      - name: Run cloud stats frontend tests
        run: node tests/js/cloud_stats.js

      # 云端计数分页循环门禁（2026-10-18 路线二）：fetchAll 每批 1000 + offset
      # 翻页，根治服务端 Max Rows（默认 1000）静默截断——行数触顶后部分讲座
      # 计数静默归零。锁满页续翻 / 尾批即停 / 整倍数空翻 / 多批合并 / 失败整体
      # null（禁部分采用）/ 50 批死循环硬顶 / order=url 稳定排序。
      - name: Run cloud pagination loop tests
        run: node tests/js/cloud_pagination.js

      # 本机开发环境短路门禁（2026-10-18 方案 B）：localhost/127.0.0.1/file: 下
      # LectureCloud 直接按云端禁用处理（一个请求都不发），本地反复刷新不再虚增
      # 公网计数；localStorage.forceCloud=1 为逃生门（强制走云端验真实写入）。
      # 锁公网域名不短路 / 本机三形态短路 / 逃生门 / localStorage 异常保守短路 /
      # fetchAll 读侧双侧行为。
      - name: Run cloud local shortcircuit tests
        run: node tests/js/cloud_local_shortcircuit.js

      # 解析器自动产出 timeUnknown（2026-10-03，方案 A）。
      # 08:00/00:00 是占位约定（源页只给日期时填充），但确有讲座真在 8:00 开始。
      # 此前该区分全靠人工在 data/lectures.json 里标注，而爬虫不产出该字段 →
      # 全量重抓会把标注全部抹掉。本套件锁定：拿到时钟标 False、只有日期标 True、
      # 人工标注不被覆盖、内部键 _hasClock 不泄漏。
      - name: Run timeUnknown auto-tag tests
        run: python tests/test_time_unknown_autotag.py

      # 时间链路方案 A 守卫（2026-10-04）：CV3/hybrid 两处 end 守卫（end==start 置空、
      # 采纳 LLM 的 end 必须 > start）、占位口径收敛到 field_vocab.is_placeholder_time
      # （is_news_record 与地点回填两处旁路）、timeConfidence 词表归一、
      # timeUnknownSource 溯源与全量重抓人工标注回填、体检新增「end==start」与
      # 「high 却命中错年信号」两档、展示层「日期待核」角标三处同步。
      - name: Run time chain fix guards (2026-10-04)
        run: python tests/test_time_fixes_20261004.py

      # 隐形记录守卫（2026-10-04 方案 B）：主库中不得存在「任一关联 URL 命中排除
      # 名单」的记录（前端永不上站却占条数，lectureCount 曾因此 3808 vs 主库 3810
      # 长期对不上）。实库回归 + 主库==前端 lectureCount 两条红线。同步登记进
      # deploy.yml 的 GATE_TESTS（test_ci_gate_coverage 反漂移强制两侧一致）——
      # 带隐形记录的状态部署上线会重现计数分歧，阻断是保护性的。
      - name: Run excluded-record guard tests
        run: python tests/test_audit_excluded_records.py

      # 前端 computed 行为门禁（2026-10-02）：论坛卡 total 口径 + clamp 签名覆盖。
      # 两处缺陷都只在**运行时数据流**上暴露（total≡recs.length、签名漏三维），
      # 既有 node 门禁只做组装冒烟与 clamp 类名一致性，看不到这两类语义错误。
      - name: Run forum card and clamp signature tests
        run: node tests/js/app_forum_and_clamp.js

      # 方案 B「两段式排序 + 远期折叠」门禁（2026-10-13）：>7 天未开始讲座折成
      # 提示条 + 24h 内置顶。三个易静默退化点：① pagedGroups 组间排序若保持
      # 日期倒序，filtered 的两段式会被分组层抵消（远期组凭日期最大弹回首屏，
      # DeepSeek 方案 A 的同款漏洞）；② far-fold 容器若非常驻单元，展开时
      #   foldedUnits 长度变化会打乱分页；③ 展开态不落 localStorage 则刷新丢状态。
      - name: Run far-future fold tests
        run: node tests/js/app_far_future_fold.js

      # 校区筛选 OR 门禁（2026-10-13）：校级讲座按 location 推导的 actualCampus
      # 参与校区筛选（点「大学城」能出校级讲座），「校级」筛选项保持全量。
      # 易静默退化点：① OR 分支被删则校级记录在任何具体校区筛里都消失；
      # ② 条件写错（如误用 l.campus）会让「校级」筛选项漏掉已推导记录。
      - name: Run campus filter tests
        run: node tests/js/app_campus_filter.js

      # 未开始讲座计数 + 筛选（2026-10-16）：计数行点数字 → upcomingOnly 叠加筛选，
      # 口径乙（upcoming + 开始时间未到的 tbd，不含进行中/过期 tbd）；无未开始时
      # 计数行整行隐藏；远期折叠激活时放平；toggle/clearFilters/模板接线锁定
      - name: Run upcoming filter tests
        run: node tests/js/app_upcoming_filter.js

      # 访问量趋势报告渲染门禁（2026-10-02）：该页此前用 innerHTML 拼接渲染，
      # 而快照 note 是唯一来自台账的自由文本（经 json.dumps 内嵌进内联脚本），
      # 含 </script> 或 <img onerror=…> 即构成存储型 XSS。现已全部改为
      # createElement/textContent；同日子脚本与数据拆为独立文件，CSP 得以
      # 从 'unsafe-inline' 收紧为 'self'。本门禁锁四项：无 innerHTML、
      # CSP 已收紧、外链齐全、DOM 化后渲染仍正常（最小 DOM 桩，无需浏览器）。
      - name: Run visits-trend render tests
        run: node tests/js/visits_trend_render.js

      # 模板卫生门禁（2026-10-12）：Vue 模板里禁止调用 _/$ 前缀方法。
      # 背景（2026-10-11 白屏事故）：Vue 3 对 _/$ 前缀方法静默跳过绑定（prod
      # 构建零警告），模板 with(this) 作用域链穿透 → ReferenceError × 25 →
      # errorHandler 只打日志 → v-cloak 整页隐藏 → 白屏。现有 node 仿真门禁
      # 用 vm 直接执行 JS 分片、跳过 Vue 模板编译环节，永远抓不到这类 bug
      # ——动态测试有覆盖盲区时，用确定性静态分析补位（同 test_stage_var_leak）。
      - name: Run template hygiene tests
        run: node tests/js/app_template_hygiene.js

      # topicHasSession 门禁（2026-10-02）：该函数此前零测试，且 n>99 时会拼出
      # 'undefined十undefined' 这种永不匹配的正则（静默失效 → 题目被重复追加
      # 「（第N期）」）。当前全库 lectureIndex 最大 32 故零触发，属「结构已坏、
      # 只是还没触发」。本门禁锁 1–99 识别正确、n>99 不产生 undefined、
      # 且哨兵不退化为空串（那会让含「讲座」的无关标题被误判为已含期数）。
      - name: Run topic session tests
        run: node tests/js/app_topic_session.js

      # 「讲座时刻是否占位」的前后端一致性门禁（2026-10-03）。
      # 08:00/00:00 是解析器的占位约定（源页只给日期），但确有讲座真在 8:00 开始，
      # 靠人工标注 timeUnknown 区分。此前前端把 08:00+00:00 都当占位、后端只当
      # 00:00，同一份数据两套答案；当时库里无「08:00 且未标注」的记录才没出事。
      # 现两侧口径统一到 field_vocab.is_placeholder_time，本门禁用同一批样例
      # 跨语言比对并锁定库中不得出现触发分叉的记录。
      - name: Run time-placeholder consistency tests
        run: node tests/js/app_time_placeholder.js

      # 前端数据流行为门禁（2026-10-02，P1）。三条都是「此前只有间接/巧合式覆盖」的
      # 关键语义，任一退化都会静默出错、零报错：
      #  ① _ltKey 跨语言一致：Python lt_key 与 JS _ltKey 无共享代码，改一侧会让
      #     **全站简介/摘要静默变空**；原覆盖靠桩数据恰好同用 '#' 字面量（改桩即失效）。
      #  ② _mergeChunk 覆盖语义：首屏 50 条是全集子集，必须覆盖而非追加，
      #     否则首页显示 3860 而非 3810；原测试用简化版 merge，未执行真实函数体。
      #  ③ main() 水位闸门：failed_sources 非空时冻结 last_scrape 是增量正确性的
      #     铁律（水位越过失败时段 → 该时段讲座永远补不回）；原覆盖只有源码字面量断言。
      #  ④ count_key_uniqueness（2026-10-18）：讲座级计数键 ck 的存在性/唯一性/
      #     规则/模板防回潮（多场页共用裸 URL 键会把一次点赞在统计页放大成 N 份）；
      #  ⑤ count_key_migration（2026-10-18）：ck 下沉过渡期的旧键→新键
      #     localStorage 迁移（幂等/写回）与缺 ck 时 single 单元键回退（B3）。
      #  ⑥ liked_filter_keys（2026-10-19）：读取侧的键口径——「只看已赞」必须同时
      #     命中场次级 ck 与合并卡的页面级 url（B3）、stats.json 必须覆盖多场页的
      #     页面级键（B4）、折叠条 count 是场次数（B6）、分页用 totalPages 判定（B5）。
      #  ⑦ stats_wants（2026-10-19）：统计页「想听数」——矩阵/年度合计/行合计三处
      #     都要累加 wants（漏判会让「只想听」的记录被当空记录跳过），显示模式与
      #     排序链路和 visits/likes 同构。
      - name: Run frontend data-flow behavior tests
        run: |
          node tests/js/app_ltkey_consistency.js
          node tests/js/app_merge_chunk.js
          node tests/js/app_year_consistency.js
          node tests/js/app_url_sync.js
          node tests/js/stats_quota_guard.js
          node tests/js/count_key_uniqueness.js
          node tests/js/count_key_migration.js
          node tests/js/liked_filter_keys.js
          node tests/js/stats_wants.js
          python tests/test_main_water_gate.py

      # 审计报告转义门禁（2026-10-02）：audit_fields.py 的 HTML 报告把抓来的
      # speaker/location/speakerBio 直接拼进 HTML（报告是 CI 附件，维护者
      # 下载后双击打开即执行），且 href="{sourceUrl}" 未限制协议，
      # javascript: 伪协议可直接点击执行。现已加 _esc/_esc_url 全面转义。
      - name: Run audit report escape tests
        run: python tests/test_audit_html_escape.py

      # 职称词表收敛门禁（2026-10-02）：项目铁律是职称/职务词表只维护一份
      # （scraper/field_vocab.py），其他代码引用而不许手抄。历史上真实发生过
      # 「秘书长」在两边词表分叉，导致同一值一条路径判正常单位、另一条判脏值。
      # 本套件扫 parsers.py 的内联职称串，断言词集落在主表并集内——
      # 将来往主表加新职称而忘了改副本时立即变红。
      - name: Run title vocab convergence tests
        run: python tests/test_title_vocab_convergence.py

      # meta 旧时刻压过正文门禁（2026-10-16，life/6829）：正文时间标签被白色
      # span 混淆（时一间/地一点）时，meta description 残留的旧「时间：」会以
      # R1 权威标签身份压过正文正确值。修复=冲突抑制+剔除不可见节点，本套件
      # 锁「落库=正文值」与「美术学院类 meta 补时刻功能不受误伤」两个方向。
      - name: Run meta time conflict tests
        run: python tests/test_meta_time_conflict_20261016.py

      # 缓存并发门禁（2026-10-02）：data/.vlm_cache.json 曾被 parsers 与
      # llm_provider 各持一把**互不可见**的锁，两边都做「整文件读→改→写回」，
      # 单进程多线程下互相覆盖整批条目 → 缓存命中下降 → 重复烧付费 API 额度。
      # 现已收敛到 scraper/llm_cache.py 一把锁一份实现，本套件同时锁静态
      # （不得再各自定义锁）与动态（200 并发写不丢条目）。
      - name: Run shared LLM cache tests
        run: python tests/test_llm_cache.py

      # 失败速查（2026-10-14 P2-6）：本文件是逐步形态，失败 step 即停、无循环可汇总。
      # 公开仓库的 step 日志匿名即可读，此摘要给出失败后的标准排查入口；
      # 部署侧（deploy.yml gate 循环）失败时会把失败测试的末尾日志直接写进摘要。
      - name: 失败排查提示写入 step summary
        if: failure()
        run: |
          {
            echo "### ❌ 门禁未通过";
            echo "点击上方红色 × 的步骤展开日志（公开仓库无需登录即可查看完整输出）。";
            echo "部署侧（deploy.yml gate）失败时会把失败测试的末尾日志直接写进摘要。";
          } >> "$GITHUB_STEP_SUMMARY"

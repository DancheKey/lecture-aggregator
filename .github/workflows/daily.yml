name: 每日自动拉取讲座数据

# 触发条件：
#   1) 定时：北京时间每天 01:00（GitHub Actions 使用 UTC，03:00 CST = 17:00 UTC 前一天）
#   2) 手动：在 Actions 页面点 "Run workflow"，或网站「抓取新数据」按钮经代理触发
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: {}

# 本工作流需要写回仓库（提交更新后的数据），并发布 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个抓取任务；新触发排队（不取消正在跑的），避免并发写冲突
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 需要完整历史以便增量基线

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      # OCR 引擎已换为 RapidOCR（onnxruntime 后端）：
      #   - 识别模型随 rapidocr-onnxruntime 包分发，无需单独下载/缓存（不再需要 ~/.EasyOCR 缓存）。
      #   - 图像处理用 opencv-python-headless，无需 libgl1 等系统图形库（headless 版已剥离 GL 依赖）。
      - name: 安装 Python 依赖
        run: pip install -r scraper/requirements.txt

      # 增量抓取：若仓库内 data/last_scrape.json 存在，则只补该时间之后的新讲座；
      # 否则（首次或缺失）自动全量，并以已有 data/lectures.json 作去重基底。
      # VLM 主通道：智谱 GLM（国内直连、免费稳定），API Key 走 GitHub Secrets（加密，绝不写明文）；
      # 模型名非敏感，明文注入即可。通道不可用时自动回落本地 RapidOCR。
      - name: 运行爬虫（增量）
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          VLM_MODEL: glm-4v-flash
        run: python scraper/scraper.py

      - name: 同步静态数据源并生成前端切片
        run: python scripts/generate_frontend_data.py

      # 铁律护栏：抓取生成的数据必须通过不变量测试，否则阻断提交/部署
      # （防止 CI 整体重跑退化、title 被 topic 覆盖、复合键重复等回归）。
      - name: 校验数据不变量（铁律护栏）
        run: python scripts/test_invariants.py

      - name: 提交并推送（仅在有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lectures.json data/last_scrape.json site/lectures.json site/lectures/latest.json site/lectures/stats.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新讲座数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      # 下面步骤将 site/ 发布为 GitHub Pages。
      # 注意：本工作流用 GITHUB_TOKEN 推送的数据提交不会触发 deploy.yml，
      # 因此由本工作流直接完成部署，保证每日新数据即时上线。
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

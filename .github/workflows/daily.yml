# 本工作流分三个 job，逐级收窄权限（2026-09-27 审计排期项：拆 job 降爆炸半径）：
#   scrape    —— 抓取+校验+体检+告警+提交推送。持有 contents:write / issues:write，
#                但**不持有 pages / id-token**：即使爬虫脚本被注入或 sources.yaml
#                引入恶意内容，也无法发布站点、无法申请 OIDC token。
#   deploy    —— 只做 Pages 发布，需要 pages:write + id-token:write，
#                但**不需要 contents:write**（数据已由 scrape 推上远端）。
#   gate      —— 失败源告警，只读数据，绝不参与写操作。
# 旧版把三件事串在单个 job：爬虫一旦异常，整班（含 Pages 发布）一起失败，
# 且爬虫 job 握有发布权限，爆炸半径过大。
name: 每日自动拉取讲座数据

# 触发条件：
#   1) 定时：每天三班（UTC = 北京时间 - 8h），2026-10-09 由两班加密为三班
#      （GitHub 排队延迟常达 5~6h，两班制会漏掉当天白天发布的讲座）：
#      - 午班：04:00 UTC = 北京时间 12:00（排队后约 12:30~14:30 执行，覆盖中午前后发布）
#      - 夜班：16:00 UTC = 北京时间 24:00（排队后约 05:00~06:00 执行，覆盖前一天傍晚至深夜发布）
#      - 晨班：22:00 UTC = 北京时间 06:00（排队后约 11:30~12:30 执行，覆盖当天上午发布）
#      三班增量互为兜底：即使某班被 GitHub 高峰期整次跳过，下班也会重抓同区间不漏数据。
#   2) 手动：在 Actions 页面点 "Run workflow"，或网站「抓取新数据」按钮经代理触发
on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch: {}

# 工作流级只给最小集合；各 job 再在 jobs.<id>.permissions 收窄。
# ⚠️ GitHub 语义：job 级 permissions 一旦声明，就**完全覆盖**这里的列表
# （不是叠加），所以 scrape job 必须显式写全它需要的 contents:write + issues:write。
permissions:
  contents: read

# 同一时间只跑一个抓取任务；新触发排队（不取消正在跑的），避免并发写冲突
concurrency:
  group: daily-scrape
  cancel-in-progress: false

# ---- runner 镜像版本：显式钉 ubuntu-24.04，不跟随 ubuntu-latest ----
# 2026-10-02：GitHub 公告 ubuntu-latest 将在 2026-10-19 ~ 11-19 渐进迁移到
# Ubuntu 26.04（https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration/）。
# 本项目**主动钉住 24.04** 而非跟随 latest，理由：
#   1) daily.yml 依赖 RapidOCR / onnxruntime（含预编译二进制），对 glibc 与系统库
#      变化最敏感——公告本身即警告新镜像「updated, and in some cases removed,
#      tools and tool versions」；
#   2) 若跟随 latest，迁移当天的流水线可能在无人值守时红掉，而 cron 失败通常要等
#      下一次运行或邮件告警才被发现；
#   3) 钉住后，升级变成**显式可测的决定**（另开 PR 改版本号并手动 workflow_dispatch
#      验证），而不是被动等推送落到自己头上。
# 将来想升级：把三处 ubuntu-24.04 改为 ubuntu-26.04 → 手动触发 daily.yml 验证
# → 通过后再合并。三处版本必须一致，由 tests/test_ci_gate_coverage.py 守卫。

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # job 级 permissions 覆盖工作流级设置：只给写回数据与告警 Issue 所需权限，
    # 刻意**不给 pages: write / id-token: write**——发布权限隔离到 deploy job。
    permissions:
      contents: write   # 提交并推送更新后的 data/ 与 site/
      issues: write     # 信息源健康检查自动创建/更新告警 Issue
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # 需要完整历史以便增量基线

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      # OCR 引擎已换为 RapidOCR（onnxruntime 后端）：
      #   - 识别模型随 rapidocr-onnxruntime 包分发，无需单独下载/缓存（不再需要 ~/.EasyOCR 缓存）。
      #   - 图像处理用 opencv-python-headless，无需 libgl1 等系统图形库（headless 版已剥离 GL 依赖）。
      - name: 安装 Python 依赖
        run: pip install -r scraper/requirements.txt

      # 增量抓取：若仓库内 data/last_scrape.json 存在，则只补该时间之后的新讲座；
      # 否则（首次或缺失）自动全量，并以已有 data/lectures.json 作去重基底。
      # VLM 主通道：智谱 GLM（国内直连、免费稳定），API Key 走 GitHub Secrets（加密，绝不写明文）；
      # 模型名非敏感，明文注入即可。GLM 不可用（429/5xx/鉴权失败/异常）时自动落第二顺位
      # Agnes-ai，仍失败则回落本地 RapidOCR。
      - name: 运行爬虫（增量）
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          VLM_MODEL: glm-4v-flash
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: agnes-3.0-flash
          JUDGE_PROVIDER: zhipu
          JUDGE_MODEL: glm-4-flash
          # 全字段双轨（2026-09-05）：规则 + 模型A 并行识别，分歧调模型B 裁决。
          # 此前缺省为 rich-only，模型B 从未进入生产链路（全库 llmVerdict=None 占 93%）。
          # 每日新增页面仅数条，A/B 调用成本可控（glm-4-flash：非推理，裁决快且稳定，返 self_extract）。
          SCNU_LLM_TEXT: '1'
        run: python scraper/scraper.py

      # 访问量快照（2026-09-10）：用 GET 取 busuanzi 当日累计值落盘入库。
      # 必须走 GET——该端点 POST 会计数 +1，用 POST 会每天给自家 PV 灌水。
      # 取数失败不阻断：脚本内部以 ::warning:: 告警并退出 0，
      # 避免外部服务抖动影响讲座数据的正常更新与部署。
      # 台账是公网访问量的唯一本地备份——busuanzi 一旦失效，历史只在这里还活着。
      - name: 抓取访问量快照（busuanzi）
        run: python scripts/fetch_visits_snapshot.py

      - name: 同步静态数据源并生成前端切片
        run: python scripts/generate_frontend_data.py

      # 访问量趋势报告（2026-09-30 起出片到 site/visits-trend.html）：随 site/ 入库、
      # 随 Pages 部署公网可见（用户要求直接在公网看趋势），下方 git add -A site 会带上它。
      - name: 生成访问量趋势报告
        run: python scripts/gen_visits_trend.py

      # 铁律护栏：抓取生成的数据必须通过不变量测试，否则阻断提交/部署
      # （防止 CI 整体重跑退化、title 被 topic 覆盖、复合键重复等回归）。
      - name: 校验数据不变量（铁律护栏）
        run: python scripts/test_invariants.py

      # 每日产物门禁快跑（2026-10-10）：daily 的数据提交用 GITHUB_TOKEN 推送，
      # GitHub **不会**为它触发 test.yml/deploy.yml——意味着缓存戳、产物一致性、
      # 对账门禁等全部 pytest 门禁在**每日主部署路径上是失效的**。
      # 实证：趋势页裸引用戳（e83f608/426651d）在线上静默跑了近一周，test_99
      # 抓不到，直到人工推送才变红。这里直跑与每日产物直接相关的 5 件测试
      # （全部离线、合计约 25 秒；与 test.yml 同一调用方式，无需 pytest），
      # 失败即红、阻断本轮提交与部署——门禁这才真正落在主路径上。
      - name: 前端产物与抓取保护门禁（每日快跑）
        run: |
          set -euo pipefail
          python tests/test_frontend_schema.py
          python tests/test_frontend_consistency.py
          python tests/test_data_reconciliation.py
          python tests/test_full_shrink_protection.py
          python tests/test_new_source_full_scan.py

      # 数据质量体检（2026-09-06）：每天抓取+修复后自动检查全库字段
      # （时间/地点/主讲人/单位的错误与缺失），报告存为运行附件保留 30 天，
      # 出现异常当天可见，不用等用户在网页上发现问题来反馈。
      #
      # 2026-10-02：此前本步恒以 0 退出（体检发现大面积异常也照样绿），
      # audit_fields.py 现已支持 --fail-on。但**不**直接加 --fail-on high：
      # 存量库有大量历史遗留问题（当前「高」严重度数十条），会令流水线天天红、
      # 久而久之被无视，比不阻断更糟。
      # 改用「基线对比」：把「高」严重度问题数写入 data/ 下的基线文件，
      # 本轮**新增**问题才阻断。存量问题随数据修复自然下降，基线随之收紧；
      # 一旦出现新引入的高严重度问题，流水线立刻变红并报出差值。
      - name: 数据质量体检（自动）
        run: python scripts/audit_fields.py --html reports/audit_fields_report.html

      - name: 字段体检基线对比（新增高危问题才阻断）
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import json, os, re, sys, subprocess
          ROOT = os.environ.get('GITHUB_WORKSPACE', '.')
          sys.path.insert(0, os.path.join(ROOT, 'scraper'))
          sys.path.insert(0, os.path.join(ROOT, 'scripts'))
          import audit_fields
          data = json.load(open(os.path.join(ROOT, 'data', 'lectures.json'),
                               encoding='utf-8'))['data']
          issues = audit_fields.audit(data)
          high = [i for i in issues if i[2] == '高']
          # 归一化到「类别|字段|描述模板」，避免同一类问题因数据变化反复触发。
          # 2026-10-10 修正（子代理审查 P2）：旧写法只按全角「（」切，
          # 而高危描述大量用 ASCII 括号/冒号/空格后直接跟实例值，切不动 →
          # 实例值进了键：当前 4 条高危里 2 条是实例级键。双向出错：
          #   误报——同记录重抓后讲者串微变 → 旧键消失、新键 count=1>base(0)
          #          → exit 1，当班数据不提交不部署；
          #   漏报——同类问题修 1 条 + 新增 1 条 → 计数相等 → 放行。
          # 新切法：在「冒号/全角冒号/全角括号/空格-半角括号/任意空白」
          # 最左出现处截断，只留模板部分。已对 audit_fields 全部 18 处
          # issue.append 的描述逐一验证归一结果互不冲突。
          _TAIL_CUT = re.compile(r'[:：]|（| \(')
          def key(i):
              m = _TAIL_CUT.search(i[3])
              tpl = i[3][:m.start()] if m else i[3]
              return f'{i[0]}|{i[1]}|{tpl}'
          cur = {}
          for i in high:
              cur[key(i)] = cur.get(key(i), 0) + 1
          base_path = os.path.join(ROOT, 'data', 'audit_baseline.json')
          base = {}
          ver_note = ''
          seed_only = False
          if os.path.exists(base_path):
              try:
                  doc = json.load(open(base_path, encoding='utf-8'))
              except Exception:
                  doc = {}
              # v1 基线用旧 key 归一（含实例值），与 v2 模板键无法对比——
              # 直接比会把全部现存键判成「新增」，首跑必然整班红。
              # 故 version 不匹配时放弃对比、直接重播种（无回归风险：宁可
              # 少拦一轮，也不让基线格式演进阻断数据发布）。
              if doc.get('version') == 2:
                  base = doc.get('high') or {}
              else:
                  seed_only = True
                  ver_note = '（基线为旧版 key 格式，本轮重播种为 v2，不对比）'
          # ⚠️ 重播种轮必须真的「不对比」：v1 旧键与 v2 模板键无法对齐，
          # 若照常计算 regressions，cur 全部 v>base(0) → exit 1，且基线
          # 永远写不回 v2 → 每班必红（2026-10-10 首版遗漏，本行守卫补上）。
          regressions = {} if seed_only else {
              k: v - base.get(k, 0) for k, v in cur.items()
              if v > base.get(k, 0)}
          total = sum(cur.values())
          print(f'高严重度问题：本次 {total} 条 / 基线 {sum(base.values())} 条 {ver_note}')
          if regressions:
              print('::error::字段体检出现基线之外的新问题（已阻断部署）：', file=sys.stderr)
              for k, d in sorted(regressions.items(), key=lambda x: -x[1]):
                  print(f'  +{d}  {k}', file=sys.stderr)
              sys.exit(1)
          # 无新增则把基线收紧到当前值（存量问题被修复时自动下调）。
          # 2026-10-10（子代理审查 P4）：直写 open('w') 改为 tmp + os.replace
          # 原子写——此前写坏会被下方 except 静默复位为 {}，下轮全部判新增、整班红。
          if cur != base:
              tmp_p = base_path + '.tmp'
              with open(tmp_p, 'w', encoding='utf-8', newline='\n') as f:
                  json.dump({'version': 2, 'high': cur}, f,
                            ensure_ascii=False, indent=2, sort_keys=True)
              os.replace(tmp_p, base_path)
              print(f'基线已更新：{base_path}')
          print('字段体检：无新增高危问题')
          PYEOF

      - name: 上传体检报告（保留 30 天）
        uses: actions/upload-artifact@v7
        with:
          name: 字段体检报告
          path: reports/audit_fields_report.html
          retention-days: 30

      # 信息源健康检查（2026-09-18）：主动探测 sources.yaml 中每个栏目 URL 的可达性。
      # 为什么需要它：scraper.fetch() 对 4xx/5xx 是「返回 None 不抛异常」，collect_links(None)
      # 又静默返回空列表——因此「学院把栏目网址换掉、旧链接 404」不会进入 failed_sources，
      # 现有失败源告警完全检测不到，外在表现只是「这个学院好久没新讲座」。
      # 本步把这种静默失效变成主动告警：异常时自动创建/更新 GitHub Issue，借邮件通知维护者。
      # 台账 data/source_health.json 随本次提交入库；脚本始终退出 0，不影响数据部署。
      # 置于「提交并推送」之前，以确保台账被本次提交带走。
      - name: 信息源健康检查（自动告警）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_source_health.py

      # G5（2026-09-22）：出片脚本会改写 HTML 版本戳，但 git add 清单不含 scripts/。
      # 若 scripts/ 有未提交改动，显式告警（不阻断）——避免「以为 CI 会处理」的静默落差。
      - name: 检查 scripts/ 未提交改动（告警）
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- scripts/)" ]; then
            echo "::warning::scripts/ 存在未提交改动（CI 的 git add 不含 scripts/，不会被自动提交，请手动 commit）："
            git status --short -- scripts/
          else
            echo "scripts/ 无未提交改动"
          fi

      - name: 提交并推送（仅在有变化时）
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-08-05 体检修复（中等-20）：generate_frontend_data.py 的缓存破坏
          # 会改写 site/index.html / site/stats.html（追加 ?v=hash），必须一并提交，
          # 否则 CI 侧的 JS 版本号更新被静默丢弃。
          # 运行时间戳（2026-09-10）：页面「更新于」显示的是「最近一次成功运行」的日期，
          # 与 data/lectures.json 的 updatedAt（数据最后真正变化的时间）分离。空增量日数据
          # 文件零改动，不与本地推送争抢同一行；本文件每次运行都刷新，且由 CI 独占维护
          # （本地生成脚本不写它），因此永远与本地改动落在不同文件，可被 git 自动合并。
          mkdir -p site/lectures
          # 用 date -u -d '+8 hours' 而非 TZ=Asia/Shanghai：后者依赖系统 tzdata，
          # 在缺少时区的环境下会输出错误的小时数却仍标注 +08:00（实测本机 Git Bash 差 8 小时）。
          LAST_RUN=$(date -u -d '+8 hours' +'%Y-%m-%dT%H:%M:%S+08:00')
          printf '{\n  "lastRunAt": "%s"\n}\n' "$LAST_RUN" > site/lectures/last_run.json
          echo "last_run.json = $LAST_RUN"
           # 2026-09-12 事故修复：显式文件清单改为目录级纳入。
           # 旧清单漏掉新增出片产物 site/lectures/visits.json，提交后工作区仍残留
           # 未暂存改动，后续同步步骤报 exit 128 中止 → 整班 cron 失败并连带跳过
           # Pages 部署（当日新讲座与访问量快照全丢）。
          # data/ 与 site/ 在 CI 中全部由脚本产出，目录级纳入不会误收 gitignore 内容；
          # 访问量趋势报告（site/visits-trend.html）也在 site/ 内，由本条一并纳入。
          git add -A data site || { echo "::error::git add 失败（产物含无法暂存的文件？查文件名/体积/磁盘）"; exit 1; }
          # 2026-09-30 事故记录：曾有一行 `git add reports/visits-trend.html`，
          # 与 .gitignore 的 `reports/`（2026-09-29 起整个 reports/ 不入库）冲突——
          # `git add` 一个被 ignore 且未跟踪的文件会以 exit 1 失败，在 `set -e` 下
          # **整班 cron 失败**，连带 deploy 被跳过 → 当日新讲座全部不上线
          # （2026-09-29 20:38Z run #136 即此因，日志停在
          #  "The following paths are ignored by one of your .gitignore files: reports"）。
          # 终解（2026-09-30）：报告出片位置改为 site/visits-trend.html（用户要求公网可看），
          # 由上面的目录级 add 覆盖，reports/ 专属 add 整块删除，此类冲突不再可能发生。
          # ⚠ 教训：改 .gitignore 前必须 grep 全仓（尤其 .github/workflows/）对该路径的 git add，
          #   两者不同步就会变成整班失败，且只在 CI 暴露、本地永远复现不出来。
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            echo "存在变更，准备提交..."
            git status --short
            # 标题用北京时间：runner 本地时区是 UTC，裸 date 会比 data/lectures.json
            # 的 updatedAt（Asia/Shanghai）慢 8 小时（2026-10-05 修正，写法同上 223 行）。
            git commit -m "chore: 自动更新讲座数据 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')" \
              || { echo "::error::git commit 失败（查 git status 输出与仓库 hooks）"; exit 1; }
            # 防线（2026-09-12）：同步/推送对未暂存改动零容忍，残留会以 exit 128 整班失败。
            # 若仍有未落入上面目录级 add 的改动（例如此后新增到其他目录的产物），补入本次提交。
            if [ -n "$(git status --porcelain)" ]; then
              echo "::warning::提交后仍有未纳入的改动，自动补入本次提交："
              git status --short
              git add -A
              git commit --amend --no-edit
            fi
            echo "提交成功，同步远端..."
            # N6 铁律（2026-09-22）：禁止对 data/*.json 做 rebase/行级三方合并
            # （本地真实事故：无冲突合并却条数漂移、__idx 错位）。
            # 显式策略：fetch 后若 origin/main 不是 HEAD 祖先（远端已在本轮运行期间
            # 前进 / 分叉）→ 放弃本轮提交并对齐远端，绝不 rebase。
            # 不推送即不推进 data/last_scrape.json 水位 → 下轮 cron 重抓同区间，不会漏抓。
            # 2026-09-30：fetch 也加重试。此前 fetch 单次裸跑，瞬时网络抖动即整班失败，
            # 且失败点在日志中无任何阶段标记，事后只能靠「有无 push 重试告警」反推卡在哪一步
            #（2026-09-29 20:38Z 那次 run 即为此类：既无 push 重试告警也无自定义 error）。
            echo "拉取远端状态..."
            _fetch_ok=0
            for _fi in 1 2 3; do
              if git fetch origin main; then _fetch_ok=1; break; fi
              if [ "$_fi" -eq 3 ]; then break; fi
              echo "::warning::git fetch 失败 (try $_fi)，5s 后重试..."
              sleep 5
            done
            if [ "$_fetch_ok" -ne 1 ]; then
              echo "::error::git fetch 连续 3 次失败（网络抖动/限流/认证）。本轮放弃推送；last_scrape 水位未推进，下轮 cron 会重抓同区间，不会漏抓。"
              exit 1
            fi
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "::warning::远端 main 已前进，按铁律放弃本轮数据提交（不做 rebase），下轮 cron 将重抓同区间"
              git reset --hard origin/main
              exit 0
            fi
            echo "推送到 origin/main..."
            # 最多重试 3 次 push，应对短时并发冲突；每次重试前重新判断远端是否前进
            for i in 1 2 3; do
              if git push origin main; then
                echo "推送成功 (try $i)"
                break
              else
                if [ $i -eq 3 ]; then
                  echo "::error::git push 第 3 次仍失败（请检查仓库 Settings -> Actions -> General -> Workflow permissions 是否为 Read and write permissions）"
                  exit 1
                fi
                echo "::warning::git push 失败 (try $i)，5s 后重试（先确认远端是否前进；前进则放弃本轮，绝不 rebase）..."
                sleep 5
                git fetch origin main
                if ! git merge-base --is-ancestor origin/main HEAD; then
                  echo "::warning::远端已前进，放弃本轮数据提交（不做 rebase），下轮 cron 将重抓同区间"
                  git reset --hard origin/main
                  exit 0
                fi
              fi
            done
            echo "推送成功"
          fi

      # 失败源告警（2026-08-05 体检修复 严重-3）：爬虫在有源失败时不推进增量水位，
      # 并把 failed_sources 写入 data/last_scrape.json（下次运行同区间自动补回）。
      # 此步放在提交/部署之后：成功抓到的数据照常上线，但工作流以红色结束，
      # 通过 GitHub 通知提醒维护者关注持续失败的源。
      # 已知设计权衡（2026-08-05 复查确认）：
      #   - 前序步骤因其它原因失败时，本步读到的旧 last_scrape 可能无 failed_sources
      #     而不额外告警——但此时工作流本就因前序失败而红，GitHub 通知仍会送达；
      #   - 存在失败源时页面其实已部署成功，Pages 状态却显示"失败"，
      #     这是「宁可误报不漏报」的有意取舍。

  # ---------------------------------------------------------------------
  # deploy：只做 Pages 发布。数据已由 scrape 推上 origin/main，此处重新检出
  # 即可拿到本轮产物，因此不需要 contents: write。
  # 说明：本工作流用 GITHUB_TOKEN 推送的数据提交**不会**触发 deploy.yml，
  # 故仍需在此直接部署，保证每日新数据即时上线。
  # ---------------------------------------------------------------------
  deploy:
    needs: scrape        # 爬虫/护栏失败时不发布（宁可不发，不发半成品）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read     # 仅检出已推送的产物
      pages: write       # 上传 Pages 产物
      id-token: write    # deploy-pages 的 OIDC 换取部署令牌
    steps:
      # 2026-09-28 修复：checkout 默认检出**触发本 run 时的 commit**（github.sha），
      # 而 scrape job 刚推送的新提交不在其中——当本轮触发后 main 有推进（尤其
      # workflow_dispatch 由旧 SHA 触发时），deploy 会把上一班的旧 last_run.json
      # /旧切片发上线（实测：官网「更新于」停在 9-25，仓库里已是 9-28）。
      # 显式检出 main 才能拿到 scrape job 刚推送的产物。
      - name: 检出已推送的数据产物
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------
  # gate：失败源告警。只读 data/last_scrape.json，不做任何写操作。
  # 独立成 job 的意义——即使 scrape 挂了，本班仍会跑它并以红色结束提醒维护者；
  # 放在 scrape job 内则会被前序失败掩盖（若失败源恰是导致本班失败的原因）。
  # ⚠️ 语义变化（拆 job 的已知代价，2026-09-27 记录）：
  #   旧版该步在 scrape job 内，读的是**本班工作区**的 last_scrape.json；
  #   拆出后重新 checkout，读的是**远端 main 上上一班提交**的版本。
  #   故当本班因源失败而在「提交并推送」之前就中断时，本班新增的 failed_sources
  #   尚未入库，gate 读到的是上一班的旧表 → 不会额外列出本班失败源。
  #   这与旧版注释里已承认的「前序失败时可能无 failed_sources 而不额外告警」同源，
  #   且不降低告警强度：本班失败本身仍使工作流变红，GitHub 通知照常送达。
  #   下一班水位未推进、会重抓同区间，失败源届时会正常累积入库并被 gate 报出。
  # ---------------------------------------------------------------------
  gate:
    needs: scrape
    if: always()        # 关键：scrape 失败时仍要执行告警检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 同 deploy：显式检出 main，读到 scrape job 刚推送的本班 last_scrape.json
      # （默认 github.sha 是触发时的旧 commit，本班失败源会被漏看）。
      - name: 检出数据
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 检查失败信息源（告警）
        run: |
          python - <<'EOF'
          import json, os, sys
          p = 'data/last_scrape.json'
          if not os.path.exists(p):
              sys.exit(0)
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          failed = d.get('failed_sources') or []
          if failed:
              print('::error::本次抓取有 %d 个信息源失败（增量水位未推进，下次自动重试）：%s'
                    % (len(failed), '；'.join(failed)))
              sys.exit(1)
          print('所有信息源抓取成功。')
          EOF

name: 部署到 GitHub Pages

# 触发：每次推送到 main（含每日自动更新数据）都会重新部署
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 发布 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新触发排队，不取消正在跑的
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # ---- 门禁：测试不绿就不许上线（2026-09-30 打通 CI 补）----
  # 此前 deploy.yml 是单 job、无 needs，与 test.yml 互不阻塞 →
  # 「测试全红照样上线」。本次 push 前的全量门禁跑在另一个工作流里，
  # 与本工作流无任何依赖关系，故此处显式重跑同一套门禁。
  #⚠ 选这个方案而非 on: workflow_run（跨工作流门禁）的原因：
  #   workflow_run 只在其工作流文件**已存在于默认分支**时才触发；
  #   一旦 test.yml 被改名/误删，部署会**静默不再触发**，公网每天的数据更新无声停摆。
  #   门禁 job 随push 必然触发，代价只是重复跑一遍（纯离线、分钟级）。
  # ⚠ GATE_TESTS 清单必须与 .github/workflows/test.yml 的步骤保持一致；
  #   漂移由 tests/test_ci_gate_coverage.py 断言（缺一个即红）。
  gate:
    # runner 镜像钉住 24.04：ubuntu-latest 将在 2026-10-19~11-19 迁移到 Ubuntu 26.04，
    # 迁移可能因系统库/工具版本变化导致门禁误红。理由与 daily.yml 同，见该文件注释。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            requirements.txt
      - name: 安装解析器依赖
        run: pip install -r scraper/requirements.txt
      - name: 安装后端依赖（ruamel 用于 sources.yaml 往返保注释）
        run: pip install -r requirements.txt
      - name: 跑全量门禁
        env:
          GATE_TESTS: >-
            tests/test_parser_golden.py
            tests/test_frontend_consistency.py
            tests/test_timeparse.py
            tests/test_hallucination_guard.py
            tests/test_data_quality.py
            tests/test_multi_session_split.py
            tests/test_hybrid.py
            tests/test_cited_judge.py
            tests/test_bio_bracket.py
            tests/test_location_prefix.py
            tests/test_frontend_schema.py
            tests/test_parser_snapshot.py
            tests/test_stage_var_leak.py
            tests/test_ledger.py
            tests/test_listdate.py
            tests/test_admin_notice_ad3.py
            tests/test_server.py
            tests/test_list_page_failure.py
            tests/test_ci_gate_coverage.py
            tests/test_env_flags.py
            tests/test_speaker_normalize.py
            tests/test_speaker_duty_suffix.py
            tests/test_speaker_title_cut.py
            tests/test_speaker_latin_name.py
            tests/test_speaker_corpus_gate.py
            tests/test_gate_reject_evidence.py
            tests/test_title_clean.py
            tests/js/app_bundle_smoke.js
            tests/js/app_longtext_flow.js
            tests/js/app_clamp_consistency.js
            tests/js/app_count_animation.js
            tests/js/app_forum_and_clamp.js
            tests/js/visits_trend_render.js
            tests/js/app_topic_session.js
            tests/js/app_ltkey_consistency.js
            tests/js/app_merge_chunk.js
            tests/js/app_time_placeholder.js
            tests/test_main_water_gate.py
            tests/test_module_compile.py
            tests/test_time_unknown_autotag.py
            tests/test_time_fixes_20261004.py
            tests/test_audit_excluded_records.py
            tests/test_source_count_consistency.py
            tests/test_llm_cache.py
            tests/test_audit_html_escape.py
            tests/test_title_vocab_convergence.py
        run: |
          set -euo pipefail
          rc=0
          for t in $GATE_TESTS; do
            case "$t" in
              *.js) cmd="node $t" ;;
              *)cmd="python $t" ;;
            esac
            echo "::group::$cmd"
            if ! $cmd; then rc=1; echo "::endgroup::"; echo "FAILED: $cmd"; else echo "::endgroup::"; fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "门禁未通过，终止部署。"
            exit 1
          fi

  deploy:
    # 门禁未绿则不部署——这就是「CI 打通」的全部含义。
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # upload-pages-artifact@v3 创建 artifact 必需
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 铁律护栏（最后防线）：部署前再校验一次数据不变量，
      # 防止任何漏网的坏数据（如手动 push 未本地验证）上线公网。
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # test_invariants.py / test_frontend_consistency.py 会 import scraper 模块与 server.py，
      # 顶层依赖 requests/yaml/bs4/ruamel.yaml 等。缺 ruamel 则一致性守卫模块级 ImportError。
      - name: 安装 Python 依赖
        run: |
          pip install -r scraper/requirements.txt
          pip install -r requirements.txt

      # 切片新鲜度守卫（2026-08-05 体检修复 中等-19）：部署前由 data/lectures.json
      # 重新生成前端切片，杜绝「手工改了 data/ 却忘跑切片脚本」导致公网切片陈旧。
      - name: 重新生成前端切片
        run: python scripts/generate_frontend_data.py

      - name: 校验数据不变量（铁律护栏）
        run: python scripts/test_invariants.py

      # 一致性守卫：server.py 下发路径与切片生成路径必须逐条一致（防双实现漂移）
      - name: 一致性守卫测试
        run: python tests/test_frontend_consistency.py

      # 把 site/ 目录作为静态站点产物上传
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
